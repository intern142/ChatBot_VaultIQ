name: Tests

on:
  push:
    branches: [vq-105-tenant-login, vq-103-tenant-middleware, vq-104-storage-namespace, vq-102-rls, vq-106-permissions, vq-107-tenant-lifecycle, vq-201-tenant-upload]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: vaultiq
          POSTGRES_PASSWORD: vaultiq_secret
          POSTGRES_DB: vaultiq
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U vaultiq"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v6

      - name: Install offline document runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libmagic1 poppler-utils tesseract-ocr tesseract-ocr-eng

      - name: Build application image
        run: docker build --tag vaultiq-vq201:test .

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Wait for PostgreSQL
        run: |
          for i in {1..30}; do
            pg_isready -h localhost -p 5432 -U vaultiq && break
            sleep 2
          done

      - name: Run migrations
        env:
          DATABASE_URL: postgresql+asyncpg://vaultiq:vaultiq_secret@localhost:5432/vaultiq
          DATABASE_URL_SYNC: postgresql://vaultiq:vaultiq_secret@localhost:5432/vaultiq
          OCR_REQUIRED: "true"
        run: |
          alembic upgrade head

      - name: Grant app user permissions
        env:
          PGPASSWORD: vaultiq_secret
        run: |
          psql -h localhost -U vaultiq -d vaultiq -c "DO \$\$ BEGIN IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'vaultiq_app') THEN CREATE ROLE vaultiq_app WITH LOGIN PASSWORD 'vaultiq_secret'; END IF; END \$\$;"
          psql -h localhost -U vaultiq -d vaultiq -c "GRANT USAGE ON SCHEMA public TO vaultiq_app;"
          psql -h localhost -U vaultiq -d vaultiq -c "GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO vaultiq_app;"
          psql -h localhost -U vaultiq -d vaultiq -c "ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO vaultiq_app;"

      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://vaultiq:vaultiq_secret@localhost:5432/vaultiq
          DATABASE_URL_SYNC: postgresql://vaultiq:vaultiq_secret@localhost:5432/vaultiq
          OCR_REQUIRED: "true"
          JWT_SECRET: test-secret
        run: |
          python -m pytest tests/ -v --tb=short